<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="Model.css">
    
    <title>My Model Asset</title>

</head>

<body>

    <header class="model-header">
        <h1>My Model Asset</h1>

    <main class="model-container">

            <img src="Image/Model.png" alt="3D Model">
            <h2>Model</h2>
            <p>3D Model</p>
        </section>

        <section class="model-card">
            <img src="Image/Room real part 2.png" alt="Room model">
            <h2>Room</h2>
            <p>Environment and interior modeling</p>
        </section>

        <section class="model-card">
            <img src="Image/Baseball.png" alt="Baseball model">
            <h2>Baseball</h2>
            <p>3D object modeling</p>
        </section>

        <section class="model-card">
            <img src="Image/Bed.png" alt="Bed model">
            <h2>Bed</h2>
            <p>3D object modeling</p>
        </section>

        <section class="model-card">
            <img src="Image/window.png" alt="Window model">
            <h2>Window</h2>
            <p>3D object modeling</p>
        </section>

        <section class="model-card">
            <img src="Image/image.png" alt="3D model">
            <h2>Asset</h2>
            <p>3D modeling work</p>
        </section>
        <h1 id="Back_Button"><a href="index.html">Back</a></h1>
